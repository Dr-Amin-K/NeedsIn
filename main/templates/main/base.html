{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Needs!n Sudan{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>

        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;

            background-image: url("{% static 'main/images/background.jpg' %}");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;

            padding-top: 150px;
        }

        .container {
            flex: 1 0 auto;   /* Main content grows */
        }

        footer {
            flex-shrink: 0;   /* Footer stays at bottom */
        }

        /* Logo styles */
        .logo { 
            font-family: 'Pacifico', cursive; 
            font-size: 3rem; 
            color: white; 
            margin: 0; 
            padding-left: 15px; 
        }
        .logo .exclamation { 
            font-family: 'Arial'; 
            font-size: 4rem; 
            color: #ff3b3b; 
        }
        .logo .sudan { 
            font-family: 'Arial', cursive; 
            font-size: 3rem; 
            color: white; 
        }

        /* Fixed header */
        .fixed-header {
            z-index: 1030; 
            background: rgba(0, 0, 0, 0.85); 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
            padding: 10px 0; 
        }

        /* Navigation */
        .nav-tabs {
            border-bottom: none; 
            margin-right: 15px; 
        }
        
        .nav-tabs .nav-link { 
            font-weight: 600; 
            color: white; 
            border: none;
            background-color: transparent; 
            transition: background-color 0.3s ease;
            margin: 0 5px;
            border-radius: 8px;
        }
        
        .nav-tabs .nav-link:hover,
        .nav-tabs .nav-link.active { 
            background-color: rgba(255, 255, 255, 0.2); 
        }

        .banner { background: rgba(0, 0, 0, 0.45); padding: 60px 20px; border-radius: 12px; }

        /* Footer styles */
        footer { 
            padding: 25px 10px; 
            background: rgba(0, 0, 0, 0.65); 
            color: white; 
            border-top: 2px solid rgba(255,255,255,0.2); 
        }
        .footer-link-icon {
            color: white;
            font-size: 1.5rem;
            margin-left: 10px;
            transition: color 0.2s ease;
        }
        .footer-link-icon:hover {
            color: #ff3b3b;
        }
    </style>
</head>
<body>

    <div class="fixed-top fixed-header">
        <div class="container-fluid d-flex justify-content-between align-items-center">
            <header>
                <h1 class="logo">
                    Needs<span class="exclamation">!</span>n <span class="sudan">Sudan</span>
                </h1>
            </header>

            <nav>
                <ul class="nav nav-tabs">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'healthcare' %}">Healthcare</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'humanitarian' %}">Humanitarian</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'energy' %}">Energy</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
                </ul>
            </nav>
        </div>
    </div>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <span class="mb-0 me-2 d-none d-sm-inline">© All Rights Reserved</span>

                <div class="d-flex align-items-center">
                    <span class="me-2 d-none d-sm-inline">Made by Dr. Amin Kamal (MIT Emerging Talent)</span>
                    
                    <a href="https://www.linkedin.com/in/dr-amin-k/" target="_blank" class="footer-link-icon">
                        <i class="fab fa-linkedin"></i>
                    </a>
                    
                    <a href="https://github.com/Dr-Amin-K" target="_blank" class="footer-link-icon">
                        <i class="fab fa-github"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
