{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Needs!n Sudan{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* 1. LAYOUT FIX: Ensure footer stays at bottom without overlapping */
        html, body {
            height: 100%;
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-image: url("{% static 'main/images/background.jpg' %}");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            /* Padding for fixed header */
            padding-top: 100px; 
        }

        .content-wrapper {
            flex: 1 0 auto; /* This pushes the footer down */
            padding-bottom: 40px;
        }

        /* 2. HEADER FIX: Use a responsive Navbar */
        .fixed-header {
            z-index: 1030; 
            background: rgba(0, 0, 0, 0.9); 
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
        }

        .logo { 
            font-family: 'Pacifico', cursive; 
            font-size: 2.2rem; 
            color: white; 
            text-decoration: none;
        }
        
        .logo:hover { color: white; }

        .logo .exclamation { font-family: 'Arial'; color: #ff3b3b; font-size: 2.8rem; }
        .logo .sudan { font-family: 'Arial'; color: white; font-size: 2.2rem; }

        /* Navigation Links Styling */
        .navbar-nav .nav-link { 
            font-weight: 600; 
            color: white !important; 
            margin: 0 10px;
            padding: 8px 15px !important;
            border-radius: 8px;
            transition: background 0.3s;
        }
        
        .navbar-nav .nav-link:hover, .navbar-nav .nav-link.active { 
            background-color: rgba(255, 255, 255, 0.2); 
        }

        /* 3. FOOTER FIX: Full visibility on mobile */
        footer { 
            background: rgba(0, 0, 0, 0.85); 
            color: white; 
            border-top: 1px solid rgba(255,255,255,0.2); 
            padding: 20px 0;
            flex-shrink: 0;
        }

        .footer-link-icon {
            color: white;
            font-size: 1.5rem;
            margin-left: 15px;
        }

        @media (max-width: 768px) {
            body { padding-top: 80px; }
            .logo { font-size: 1.6rem; }
            .logo .exclamation { font-size: 2rem; }
            .logo .sudan { font-size: 1.6rem; }
            
            /* Navbar adjustments for mobile */
            .navbar-collapse {
                background: rgba(0,0,0,0.95);
                padding: 20px;
                border-radius: 10px;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top fixed-header">
        <div class="container-fluid px-4">
            <a class="logo" href="{% url 'home' %}">
                Needs<span class="exclamation">!</span>n <span class="sudan">Sudan</span>
            </a>

            <button class="navbar-toggler border-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'healthcare' %}">Healthcare</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'humanitarian' %}">Humanitarian</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'energy' %}">Energy</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="content-wrapper">
        <div class="container">
            {% block content %}
            {% endblock %}
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="row align-items-center text-center text-md-start">
                <div class="col-md-6 mb-3 mb-md-0">
                    <p class="mb-0">© All Rights Reserved | Needs!n</p>
                    <small class="d-block d-md-none">By Dr. Amin Kamal (MIT Emerging Talent)</small>
                </div>
                <div class="col-md-6 d-flex justify-content-center justify-content-md-end align-items-center">
                    <span class="me-3 d-none d-md-inline">By Dr. Amin Kamal (MIT Emerging Talent)</span>
                    <a href="https://www.linkedin.com/in/dr-amin-k/" target="_blank" class="footer-link-icon"><i class="fab fa-linkedin"></i></a>
                    <a href="https://github.com/Dr-Amin-K" target="_blank" class="footer-link-icon"><i class="fab fa-github"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
