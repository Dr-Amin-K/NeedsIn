{% load static %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
    #map { 
        height: 75vh; 
        width: 100%; 
        border-radius: 12px; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        background: #f0f2f5; 
    }
    
    .plus-marker-icon {
        background-color: #1a5ebedf; border-radius: 50%;
        width: 28px; height: 28px; border: 3px solid white;
        text-align: center; line-height: 28px; color: white; 
        font-size: 20px; font-weight: bold; box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    }

    .popup-list { max-height: 220px; overflow-y: auto; list-style: none; padding: 0; margin-top: 5px; border-top: 1px solid #eee; }
    .popup-item { border-bottom: 1px solid #f0f0f0; padding: 10px 0; color: #333; }
</style>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const SUDAN_CENTER = [15.5, 30.2]; 

    const map = L.map('map', {
        center: SUDAN_CENTER,
        zoom: 5.5,             
        zoomSnap: 0.1,
        scrollWheelZoom: false
    });

    // CHANGED: Use Voyager tiles for English labels and colorful blue water
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '© OpenStreetMap contributors © CARTO'
    }).addTo(map);

    fetch('https://raw.githubusercontent.com/datasets/geo-boundaries-world-110m/master/countries/SDN.geojson')
        .then(res => res.json())
        .then(data => {
            const border = L.geoJSON(data, {
                style: {
                    color: "#3388ff",
                    weight: 2,          
                    fillColor: "#3388ff", 
                    fillOpacity: 0.05
                }
            }).addTo(map);
            
            // Automatically frames the entire Republic of Sudan (North to South)
            map.fitBounds(border.getBounds(), { padding: [30, 30] });
        });

    const markerGroup = L.featureGroup().addTo(map);

    async function loadPosts() {
        try {
            const response = await fetch("/api/healthcare-posts/");
            const allPosts = await response.json();
            const filterEl = document.getElementById('timeFilter');
            const selectedLimit = filterEl ? filterEl.value : 'all';
            const filteredPosts = filterByTime(allPosts, selectedLimit);
            markerGroup.clearLayers();
            renderMarkers(filteredPosts);
        } catch (error) {
            console.error("Map Error:", error);
        }
    }

    function filterByTime(posts, limit) {
        if (limit === 'all') return posts;
        const now = new Date();
        return posts.filter(post => {
            if (!post.date) return false;
            const postDate = new Date(post.date);
            const diffDays = (now - postDate) / (1000 * 3600 * 24);
            if (limit === 'day') return diffDays <= 1;
            if (limit === 'week') return diffDays <= 7;
            if (limit === 'month') return diffDays <= 30;
            if (limit === 'year') return diffDays <= 365;
            return true;
        });
    }

    function renderMarkers(posts) {
        const cityGroups = {};
        posts.forEach(post => {
            const cityName = post.city || "Khartoum / Unknown Location";
            if (!cityGroups[cityName]) cityGroups[cityName] = [];
            cityGroups[cityName].push(post);
        });

        for (const [cityName, group] of Object.entries(cityGroups)) {
            const lat = parseFloat(group[0].lat);
            const lon = parseFloat(group[0].lon);
            const popupHTML = generatePopupHTML(group, cityName);

            const isUnknown = cityName.includes("Unknown") || cityName.includes("Khartoum");
            const marker = L.marker([lat, lon], {
                icon: isUnknown ? L.divIcon({
                    className: 'custom-div-icon',
                    html: `<div class="plus-marker-icon">+</div>`,
                    iconSize: [32, 32], iconAnchor: [16, 16]
                }) : new L.Icon.Default()
            });
            
            marker.addTo(markerGroup).bindPopup(popupHTML, {
                maxWidth: 300, autoPan: true, autoPanPadding: L.point(50, 80), keepInView: true
            });
        }
    }

    function generatePopupHTML(posts, cityName) {
        const displayTitle = (cityName.includes("Khartoum") || cityName.includes("Unknown")) 
                           ? "Khartoum / Unknown Location" : cityName;
        
        let html = `<div><h3 style="margin:0; font-size:1rem; color:#2c3e50;">${displayTitle}</h3>`;
        html += `<p style="margin:2px 0 8px 0; font-size:0.8rem; color:#7f8c8d;">Posts: <b>${posts.length}</b></p>`;
        html += `<ul class="popup-list">`;
        posts.forEach(post => {
            html += `<li class="popup-item">
                <div style="font-size:0.7rem; color:#888; font-weight:bold;">group: ${post.group_name}</div>
                <b style="font-size:0.9rem;">${post.author}</b> <small style="color:#95a5a6;">(${post.date || ''})</small>
                <p style="margin:5px 0; font-size:0.85rem; color:#34495e;">${post.text.substring(0, 100)}...</p>
                <a href="${post.link}" target="_blank" style="font-size:0.8rem; font-weight:bold; color:#3498db; text-decoration:none;">View Post →</a>
            </li>`;
        });
        return html + `</ul></div>`;
    }

    const filterEl = document.getElementById('timeFilter');
    if (filterEl) { filterEl.addEventListener('change', loadPosts); }
    loadPosts();
    setInterval(loadPosts, 60000); 
</script>
