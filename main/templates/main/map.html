{% load static %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
    #map { 
        height: 75vh; 
        width: 100%; 
        border-radius: 12px; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        background: #f8f9fa;
    }
    
    /* FIX: Customizing the popup container to handle internal scrolling better */
    .leaflet-popup-content-wrapper {
        padding: 5px;
        border-radius: 8px;
    }

    .leaflet-popup-content {
        margin: 10px;
        width: 260px !important; /* Set a consistent width */
    }

    .plus-marker-icon {
        background-color: #3388ff; 
        border-radius: 50%;
        width: 28px; height: 28px; 
        border: 3px solid white;
        text-align: center;
        line-height: 28px;
        color: white; font-size: 20px; font-weight: bold;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    /* Scrollable list styling */
    .popup-list { 
        max-height: 220px; /* Limits height to keep the header visible */
        overflow-y: auto; 
        list-style: none; 
        padding: 0; 
        margin: 5px 0 0 0; 
        border-top: 1px solid #eee;
    }
    
    .popup-item { border-bottom: 1px solid #eee; padding: 10px 0; color: #333; }
    .popup-item:last-child { border-bottom: none; }
</style>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    const SUDAN_CENTER = [15.5, 30.0]; 
    const outerBounds = [[3.0, 18.0], [24.0, 42.0]];

    const map = L.map('map', {
        center: SUDAN_CENTER,
        zoom: 5,
        minZoom: 4,
        maxBounds: outerBounds,
        maxBoundsViscosity: 1.0
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const markerGroup = L.featureGroup().addTo(map);

    // Common Popup Options to fix the "cropping" issue
    const customPopupOptions = {
        maxWidth: 300,
        autoPan: true,
        autoPanPadding: L.point(50, 50), // Ensures 50px of space between popup and map edge
        keepInView: true,                // Keeps the popup in view if the user drags the map
        className: 'custom-popup'
    };

    async function loadPosts() {
        try {
            const response = await fetch("/api/healthcare-posts/");
            const allPosts = await response.json();
            const filterEl = document.getElementById('timeFilter');
            const selectedLimit = filterEl ? filterEl.value : 'all';
            const filteredPosts = filterByTime(allPosts, selectedLimit);
            markerGroup.clearLayers();
            renderMarkers(filteredPosts);
        } catch (error) {
            console.error("Map Error:", error);
        }
    }

    function filterByTime(posts, limit) {
        if (limit === 'all') return posts;
        const now = new Date();
        return posts.filter(post => {
            if (!post.date) return false;
            const postDate = new Date(post.date);
            const diffDays = (now - postDate) / (1000 * 3600 * 24);
            if (limit === 'day') return diffDays <= 1;
            if (limit === 'week') return diffDays <= 7;
            if (limit === 'month') return diffDays <= 30;
            if (limit === 'year') return diffDays <= 365;
            return true;
        });
    }

    function renderMarkers(posts) {
        const cityGroups = {};
        posts.forEach(post => {
            const cityName = post.city || "Khartoum / Unknown Location";
            if (!cityGroups[cityName]) cityGroups[cityName] = [];
            cityGroups[cityName].push(post);
        });

        for (const [cityName, group] of Object.entries(cityGroups)) {
            const lat = parseFloat(group[0].lat);
            const lon = parseFloat(group[0].lon);
            const popupHTML = generatePopupHTML(group, cityName);

            let marker;
            if (cityName.includes("Unknown") || cityName.includes("Khartoum")) {
                marker = L.marker([lat, lon], {
                    icon: L.divIcon({
                        className: 'custom-div-icon',
                        html: `<div class="plus-marker-icon">+</div>`,
                        iconSize: [32, 32],
                        iconAnchor: [16, 16] 
                    })
                });
            } else {
                marker = L.marker([lat, lon]);
            }
            
            // Attach popup with the fixed options
            marker.addTo(markerGroup).bindPopup(popupHTML, customPopupOptions);
        }
    }

    function generatePopupHTML(posts, cityName) {
        let displayTitle = (cityName.includes("Khartoum") || cityName.includes("Unknown")) 
                           ? "Khartoum / Unknown Location" : cityName;
        
        let html = `<div>`;
        html += `<h3 style="margin:0 0 2px 0; color:#333; font-size:1rem;">${displayTitle}</h3>`;
        html += `<p style="margin:0 0 8px 0; font-size:0.8rem; color:#666;">Total Reports: <b>${posts.length}</b></p>`;
        html += `<ul class="popup-list">`;
        posts.forEach(post => {
            html += `
            <li class="popup-item">
                <div style="font-size:0.7rem; color:#888; font-weight:bold; text-transform:lowercase;">group: ${post.group_name}</div>
                <b style="font-size:0.8rem;">${post.author}</b> <small style="color:#888;">(${post.date || ''})</small>
                <p style="margin:5px 0; font-size:0.85rem; line-height:1.3;">${post.text.substring(0, 120)}...</p>
                <a href="${post.link}" target="_blank" style="font-size:0.8rem; font-weight:bold; color:#3388ff; text-decoration:none;">View Post →</a>
            </li>`;
        });
        html += `</ul></div>`;
        return html;
    }

    const filterEl = document.getElementById('timeFilter');
    if (filterEl) { filterEl.addEventListener('change', loadPosts); }
    loadPosts();
    setInterval(loadPosts, 60000); 
</script>
