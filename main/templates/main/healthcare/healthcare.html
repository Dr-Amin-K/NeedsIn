{% extends "main/base.html" %}

{% block title %}Healthcare — Needs in Sudan{% endblock %}

{% block content %}
<div class="text-white">
    <h3>Healthcare Information</h3>
    <p>This page shows healthcare and medical needs for people in Sudan.</p>

    <div style="background: rgba(255,255,255,0.1); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <label for="timeFilter" style="font-weight: bold; margin-right: 10px;">Filter by Post Date:</label>
        <select id="timeFilter" style="padding: 8px; border-radius: 4px; border: none; background: #fff; color: #333; cursor: pointer;">
            <option value="all">All Time</option>
            <option value="day">Past 24 Hours</option>
            <option value="week">Past Week</option>
            <option value="month">Past Month</option>
            <option value="year">Past Year</option>
        </select>
    </div>

    {% include "main/map.html" %}
</div>
{% endblock %}
